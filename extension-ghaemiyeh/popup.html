<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 460px; max-height: 600px; overflow-y: auto; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 13px; background: #1a1a2e; color: #e0e0e0; }
    .header { background: linear-gradient(135deg, #16213e, #0f3460); padding: 12px; text-align: center; position: sticky; top: 0; z-index: 5; }
    .header h1 { font-size: 15px; color: #e94560; margin-bottom: 2px; }
    .header span { font-size: 11px; color: #a0a0b0; }
    .content { padding: 10px; }
    .section { margin-bottom: 10px; }
    .section-title { font-size: 11px; color: #64748b; margin-bottom: 5px; letter-spacing: 0.5px; }
    label { display: block; font-size: 11px; color: #94a3b8; margin: 6px 0 3px; }
    input, select { width: 100%; padding: 7px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-family: inherit; font-size: 12px; }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    button { flex: 1; padding: 8px 6px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #e94560; color: white; }
    .btn-secondary { background: #0f3460; color: #e0e0e0; }
    .btn-green { background: #2ecc71; color: white; }
    .btn-stop { background: #c0392b; color: white; }
    .btn-teal { background: #1abc9c; color: white; }
    .btn-blue { background: #3498db; color: white; }
    .stats { background: #16213e; border-radius: 8px; padding: 8px; margin-bottom: 8px; font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
    .stats b { color: #e94560; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 4px 5px; border-bottom: 1px solid #0f3460; text-align: right; vertical-align: middle; }
    th { color: #64748b; font-weight: 600; position: sticky; top: 0; background: #1a1a2e; }
    td.t { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .st { font-size: 10px; padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
    .st-queued { background: #334155; color: #cbd5e1; }
    .st-downloading, .st-uploading { background: #1d4ed8; color: #dbeafe; }
    .st-done { background: #14532d; color: #bbf7d0; }
    .st-duplicate { background: #713f12; color: #fde68a; }
    .st-failed, .st-auth-error { background: #7f1d1d; color: #fecaca; }
    .st-unsupported, .st-need-manual { background: #581c87; color: #e9d5ff; }
    .row-btn { border: none; background: #0f3460; color: #e0e0e0; border-radius: 4px; font-size: 10px; padding: 2px 6px; cursor: pointer; }
    .log { background: #0d1117; border-radius: 6px; padding: 8px; max-height: 130px; overflow-y: auto; font-size: 10px; font-family: Consolas, monospace; margin-top: 8px; }
    .log .ok { color: #2ecc71; } .log .err { color: #e74c3c; } .log .info { color: #3498db; } .log .warn { color: #f39c12; }
    .hint { font-size: 10px; color: #94a3b8; margin-top: 5px; line-height: 1.5; }
    .inline { display: flex; gap: 6px; } .inline > * { flex: 1; }
    .small { font-size: 10px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 کتاب‌های غایمیه</h1>
    <span>تریس → دانلود → کالکشن</span>
  </div>
  <div class="content">

    <div class="section">
      <div class="section-title">کالکشن مقصد</div>
      <select id="collSelect"><option value="">در حال خواندن…</option></select>
      <div class="inline" style="margin-top:6px">
        <input id="cName" type="text" placeholder="نام کالکشن جدید" autocomplete="off">
        <input id="cSlug" type="text" placeholder="slug" dir="ltr" style="flex:0.8" autocomplete="off">
      </div>
      <div class="btn-row">
        <button type="button" class="btn-teal" id="btnCreateColl">＋ ساخت کالکشن</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">آغاز تریس</div>
      <input id="traceUrl" type="text" dir="ltr" placeholder="https://www.ghaemiyeh.ir/category-page?category=51636" autocomplete="off">
      <div class="inline" style="margin-top:6px">
        <label style="flex:0.9;margin:0">فاصله (ثانیه)
          <input id="delaySec" type="number" min="0" max="30" value="3" style="padding:4px">
        </label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-primary" id="btnTrace">🔎 تریس از URL</button>
        <button type="button" class="btn-blue" id="btnTraceTab">📄 همین تب</button>
      </div>
      <div class="hint" id="traceHint"></div>
    </div>

    <div class="section">
      <div class="section-title">کتاب‌های یافته</div>
      <div class="stats" id="statBar">هنوز تریسی نشده</div>
      <div style="max-height:190px; overflow-y:auto; border:1px solid #0f3460; border-radius:6px">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="chkAll" checked style="width:auto"></th>
              <th>عنوان / id</th>
              <th>دانلود</th>
              <th>وضعیت</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bookTbody"></tbody>
        </table>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-green" id="btnRun">⬇ دانلود و افزودن همهٔ انتخابی</button>
        <button type="button" class="btn-stop" id="btnStop" disabled>⏹ توقف</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-secondary" id="btnRetry">↻ تکرار خطاها</button>
        <button type="button" class="btn-secondary" id="btnUploadManual">📤 آپلود دستی</button>
      </div>
      <div class="hint">
        «آپلود دستی»: فایل DOCX را از کامپیوتر انتخاب کن (برای کتاب‌های need-manual /
        failed). 401 = اول وارد <b>corpus.ai.ismc.ir/dashboard</b> شو.
      </div>
    </div>

    <div class="log" id="logBox"></div>
  </div>
  <input type="file" id="fileInput" accept=".docx" style="display:none">
  <script src="popup.js"></script>
</body>
</html>
