services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:5055:5055"
    environment:
      HOST: 0.0.0.0
      PORT: "5055"
      PCT_DB: /data/thesaurus.db
      STATIC_DIR: /dashboard
      # Dashboard password (PCM-09): value comes from the local .env file
      # (gitignored). Never hardcode the password in this file or the repo.
      PCT_DASHBOARD_PASSWORD: ${PCT_DASHBOARD_PASSWORD:-}
      # PCM-14B: writable store for uploaded DOCX originals + Word Factory
      # outputs (data/knowledge/{files,out}). Must be a writable volume.
      PCT_KNOWLEDGE_DATA_DIR: /data-files/knowledge
      # PCM-25 DC#5: knowledge studio pipeline (config-guarded — empty values
      # keep the ES/embedding factories 'blocked', exactly as before). On s52
      # the real values live in .env: a standalone ES container (cached image
      # elasticsearch:8.13.4, data at data/es) and the shared Ollama
      # embedding endpoint (172.20.1.53, the same one the RAG stack uses).
      PCT_ES_URL: ${PCT_ES_URL:-}
      PCT_EMBEDDING_URL: ${PCT_EMBEDDING_URL:-}
      PCT_EMBEDDING_MODEL: ${PCT_EMBEDDING_MODEL:-}
      PCT_EMBEDDING_DIM: ${PCT_EMBEDDING_DIM:-}
      # PCM-25 DC#5: per-request embedding timeout (seconds). The previous
      # hardcoded 120s killed the ~2.6k-batch al-Ghadir export mid-flight
      # (job j-7a192943, TimeoutError at retry 3). Code default is 600.
      PCT_EMBEDDING_TIMEOUT: ${PCT_EMBEDDING_TIMEOUT:-}
    volumes:
      - ./backend/thesaurus.db:/data/thesaurus.db
      - ./dashboard:/dashboard:ro
      - ./data:/data-files
    restart: unless-stopped
