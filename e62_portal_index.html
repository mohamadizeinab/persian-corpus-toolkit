<title>رگ | پورتال هوشمند پاسخ‌گویی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#fffbeb; --bg2:#fff7ed; --card:#ffffff; --card2:#fffdf8;
  --tx:#1c1917; --tx2:#57534e; --acc:#b45309; --acc2:#d97706;
  --ok:#047857; --warn:#b45309; --bad:#b91c1c; --line:#e7e5e4;
  --ring:#d97706;
  --shadow:0 1px 2px rgba(28,25,23,.05), 0 10px 28px rgba(120,53,15,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100vh;
  background:
    radial-gradient(880px 380px at 100% -8%, #fde68a 0%, transparent 58%),
    var(--bg);
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
::selection{background:#fde68a;color:var(--tx)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
a{color:var(--acc);text-underline-offset:3px}
a:hover{color:#92400e}
header{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:12px 22px;
  border-bottom:1px solid var(--line);background:rgba(255,251,235,.9);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.logo{font-size:22px;font-weight:800;color:var(--tx);line-height:1}
.logo small{color:var(--tx2);font-weight:500;font-size:12px;margin-inline-start:8px}
nav{display:flex;gap:4px;margin-inline-start:8px;flex:1;min-width:0}
nav button{background:transparent;border:0;color:var(--tx2);font:inherit;font-size:14.5px;
  padding:8px 12px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:#fff7ed;color:var(--tx)}
nav button.on{background:#fef3c7;color:#92400e;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.pill b{color:var(--tx)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(4,120,87,.15)}
.dot.busy{background:var(--warn);box-shadow:0 0 0 3px rgba(180,83,9,.15)}
button{font-family:inherit;cursor:pointer}
button.primary{background:var(--acc2);border:0;color:#1c1917;font:inherit;font-weight:700;
  padding:10px 18px;border-radius:12px;cursor:pointer;transition:background .15s,box-shadow .15s}
button.primary:hover{background:#f59e0b;box-shadow:0 6px 16px rgba(217,119,6,.25)}
button.primary:disabled{opacity:.55;cursor:default;box-shadow:none}
button.ghost{background:var(--card);border:1px solid #d6d3d1;color:var(--tx);font:inherit;
  padding:9px 14px;border-radius:12px;cursor:pointer;transition:background .15s,border-color .15s}
button.ghost:hover{background:#fff7ed;border-color:#fdba74}
button.ghost.on{background:#fef3c7;border-color:#fdba74;color:#92400e;font-weight:700}
button.small{font-size:12.5px;padding:6px 11px;border-radius:9px}
button:active{transform:translateY(1px)}
main{max-width:1040px;margin:0 auto;padding:28px 18px 88px}
.hero{padding:32px 28px;border-radius:18px;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:27px;line-height:1.65;font-weight:800}
.hero p{margin:0;color:var(--tx2);line-height:1.95;font-size:15px;max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
  margin-bottom:14px;box-shadow:var(--shadow)}
textarea,input{width:100%;background:#fff;border:1px solid #d6d3d1;color:var(--tx);
  border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.7;resize:vertical;
  transition:border-color .15s,box-shadow .15s}
textarea::placeholder,input::placeholder{color:#78716c}
textarea:focus,input:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(217,119,6,.22)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #d6d3d1;background:#fff;
  padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px;user-select:none;
  transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:#fdba74;background:#fff7ed}
.chip.on{border-color:var(--acc2);background:#fef3c7;color:#1c1917;font-weight:700}
.chip .em{font-size:15px}
.chip.lock{opacity:.75;border-style:dashed;cursor:pointer}
.chip.lock:hover{background:#fef2f2;border-color:#fca5a5}
.chip.lock small{color:var(--bad);font-weight:600;font-size:11px}
.bar{height:10px;background:#f5f5f4;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.barfill{height:100%;background:linear-gradient(90deg,#f59e0b,#b45309);border-radius:999px;transition:width .3s}
.mstone{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;background:var(--card2);margin-bottom:9px}
.mstone.unlocked{border-color:#a7f3d0;background:#f0fdf4}
.mstone .ic{font-size:20px;line-height:1}
.mstone b{font-size:14.5px}
.mstonehint{color:var(--tx2);font-size:12px;line-height:1.6;margin-top:2px}
.mstone .need{margin-inline-start:auto;font-size:12.5px;color:var(--tx2);white-space:nowrap}
.lockbtn{background:#fff;border:1px solid var(--line);color:var(--tx2);border-radius:8px;
  padding:3px 9px;font:inherit;font-size:12px;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans{border:1px solid var(--line);border-inline-start:3px solid var(--acc2);border-radius:14px;
  background:var(--card);padding:14px 16px;margin-top:12px}
.ans .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--tx2);margin-bottom:8px}
.badge{background:#fef3c7;color:#92400e;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.badge.ok{background:#d1fae5;color:#065f46}
.ans p{margin:0 0 12px;line-height:2;font-size:15.5px;white-space:pre-wrap}
.ans p:last-of-type{margin-bottom:0}
.srcchip{display:inline-flex;align-items:center;gap:5px;background:#fff7ed;border:1px solid #fde68a;
  color:#92400e;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;
  white-space:normal;vertical-align:middle;margin-inline-start:6px;line-height:1.7}
.cites{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.cites summary{cursor:pointer;color:var(--tx2);font-size:13.5px;font-weight:600}
.cites summary:hover{color:var(--tx)}
.cites ol{margin:10px 0 0;padding-inline-start:22px}
.cites li{margin-bottom:10px;line-height:1.9;font-size:14px}
.cites .ex{color:var(--tx2);font-size:13px;line-height:1.9;border-inline-start:2px solid #fde68a;
  padding-inline-start:9px;margin-top:3px}
.stars{display:inline-flex;gap:1px}
.stars button{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:#d6d3d1;padding:2px;
  transition:color .15s}
.stars button:hover,.stars button.on{color:var(--acc2)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc2);margin-inline-end:7px;
  animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.progress{color:var(--tx2);font-size:13.5px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{color:var(--tx2);font-weight:600}
tbody tr:hover td{background:#fff7ed}
td.num,th.num{text-align:center;white-space:nowrap}
.tag{font-size:11.5px;border:1px solid #e7e5e4;background:#fff;border-radius:999px;padding:2px 8px;
  color:var(--tx2);margin-inline-start:5px}
.muted{color:var(--tx2);font-size:13px;line-height:1.7}
.post-body{line-height:2.05;font-size:15px;white-space:pre-wrap;border-top:1px solid var(--line);
  margin-top:12px;padding-top:12px}
.lv{color:#92400e;font-weight:700}
.rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;background:#fef3c7;color:#92400e;font-weight:800;font-size:13px}
.rank.r1{background:#fbbf24;color:#451a03}
.rank.r2{background:#fde68a}
.rank.r3{background:#fed7aa}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #e7e5e4;border-top-color:var(--acc2);
  border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-inline-end:7px}
@keyframes sp{to{transform:rotate(360deg)}}
/* V4M-P1: in-place vote feedback (no full re-render) */
button.ghost.busy{opacity:.55;cursor:default}
.vote-pop{display:inline-block;animation:vp .4s ease}
@keyframes vp{0%{transform:scale(1)}45%{transform:scale(1.07)}100%{transform:scale(1)}}
/* V4M-P2: contextual CTA microinteractions (additive; both themes; reduced-motion opt-out below) */
button.primary:hover:not(:disabled),button.ghost:hover:not(:disabled){transform:translateY(-1px)}
button.primary:active:not(:disabled),button.ghost:active:not(:disabled){transform:translateY(1px)}
button.primary.busy{opacity:.55;cursor:default;box-shadow:none}
button.small.busy{opacity:.55;cursor:default}
.cta-done{animation:ctadone .9s ease}
@keyframes ctadone{0%{box-shadow:0 0 0 0 rgba(4,120,87,.45)}60%{box-shadow:0 0 0 9px rgba(4,120,87,0)}100%{box-shadow:0 0 0 0 rgba(4,120,87,0)}}
/* P3: QA-bank progressive list — additive, both themes, reduced-motion opt-out below */
.qa-actions{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.qa-actions .like,.qa-actions .dislike{font-size:13px;padding:5px 11px}
.qa-star{background:none;border:0;cursor:pointer;color:#d6d3d1;line-height:1;padding:1px;
  transition:color .15s,transform .15s;display:inline-block}
.qa-star:hover,.qa-star.on{color:var(--acc2)}
/* hierarchical: 5th (max) largest+gold, 1st (min) smallest */
.qa-star.s1{font-size:13px}
.qa-star.s2{font-size:15px}
.qa-star.s3{font-size:17px}
.qa-star.s4{font-size:19px}
.qa-star.s5{font-size:23px}
.qa-star.s5.on{color:#f59e0b}
.qa-vote-pop{animation:qp .45s ease}
@keyframes qp{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.qa-card.fresh{animation:qafade .6s ease}
@keyframes qafade{0%{opacity:.35;transform:translateY(5px)}100%{opacity:1;transform:none}}
.qa-sentinel{height:1px}
.qa-loader{text-align:center;padding:14px;color:var(--tx2);font-size:13px}
.qa-nudge{margin-top:9px;border:1px dashed var(--line);border-radius:10px;padding:8px 11px;
  font-size:13px;line-height:1.8;color:var(--tx2);display:none}
.qa-nudge.on{display:block}
.qa-nudge textarea{width:100%;box-sizing:border-box;margin-top:6px;border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-size:13px;font-family:inherit;background:var(--card);color:var(--tx)}
.qa-nudge .nrow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
/* V4M-P3: floating next-page CTA (additive; both themes; no motion) */
#floatNext{position:fixed;bottom:18px;inset-inline-start:18px;z-index:30;box-shadow:0 8px 24px rgba(217,119,6,.35)}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;z-index:99;display:none;background:#1c1917;
  color:#fffbeb;padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;
  box-shadow:var(--shadow);max-width:min(380px,calc(100vw - 36px))}
.modal-back{position:fixed;inset:0;background:rgba(28,25,23,.46);z-index:50;display:flex;
  align-items:center;justify-content:center;padding:18px}
.modal-card{width:min(400px,100%);margin-bottom:0}
details summary{cursor:pointer;color:var(--tx2);font-size:13.5px}
details summary:hover{color:var(--tx)}
@media(max-width:760px){
  header{padding:10px 14px}
  nav{order:5;flex-basis:100%;margin-inline-start:0;overflow-x:auto}
  nav button{white-space:nowrap}
  .hero{padding:22px 16px}
  .hero h1{font-size:22px}
  main{padding:18px 14px 72px}
  th,td{padding:8px 6px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ldot,.spin,.vote-pop,.cta-done,.qa-vote-pop,.qa-card.fresh{animation:none}
  button,.chip,nav button{transition:none}
  button:active{transform:none}
  button.primary:hover:not(:disabled),button.ghost:hover:not(:disabled){transform:none}
  button.primary:active:not(:disabled),button.ghost:active:not(:disabled){transform:none}
}
/* V3-9: extra tokens for JS inline styles + dark theme (purely additive; light unchanged) */
:root{--soft:#fef3c7;--softtx:#92400e;--chipbg:#f1f5f9;--chiptx:#64748b;--info:#e0f2fe;--infotx:#0369a1;--line2:#f1f5f9;--div:#e2e8f0;--mute4:#d6d3d1}

/* V3-9: theme (light/dark/system) — shared via rag_theme; pre-paint script already set data-theme */
(function(){
  var KEY="rag_theme", MODES=["light","dark","system"];
  function stored(){try{var v=localStorage.getItem(KEY);return MODES.indexOf(v)>=0?v:"system";}catch(e){return "system";}}
  function resolved(c){if(c==="system"){try{return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}catch(e){return "light";}}return c;}
  function paint(seg,c){seg.innerHTML=MODES.map(function(m){
    var g=m==="light"?"\u2600":m==="dark"?"\u263E":"\u25D1";
    return '<button type="button" data-th="'+m+'" aria-pressed="'+(c===m)+'">'+g+'</button>';
  }).join("");seg.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){apply(b.getAttribute("data-th"));});});}
  function apply(c,quiet){if(MODES.indexOf(c)<0)c="system";
    try{localStorage.setItem(KEY,c);}catch(e){}
    try{document.documentElement.setAttribute("data-theme",resolved(c));}catch(e){}
    if(!quiet){try{document.dispatchEvent(new CustomEvent("rag-theme-change",{detail:{choice:c}}));}catch(e){}
      var seg=$("#themeSeg");if(seg)paint(seg,c);}}
  window.__v39applyTheme=apply;
  function boot(){
    var seg=$("#themeSeg");if(!seg)return;
    var c=stored();
    try{document.documentElement.setAttribute("data-theme",resolved(c));}catch(e){}
    paint(seg,c);
    window.addEventListener("storage",function(e){if(e.key===KEY){c=stored();try{document.documentElement.setAttribute("data-theme",resolved(c));}catch(e2){}paint(seg,c);}});
    document.addEventListener("rag-theme-change",function(e){c=(e.detail&&e.detail.choice)||stored();apply(c,true);paint(seg,c);});
    try{var mq=matchMedia("(prefers-color-scheme: dark)");
      function onMq(){if(c==="system")document.documentElement.setAttribute("data-theme",mq.matches?"dark":"light");}
      if(mq.addEventListener)mq.addEventListener("change",onMq);else if(mq.addListener)mq.addListener(onMq);}catch(e){}
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

function toast(msg){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3500);}
async function api(path,opt={}){
  const h={"Content-Type":"application/json"};
  if(TOKEN)h.Authorization="Bearer "+TOKEN;
  const r=await fetch("/api"+path,{...opt,headers:h});
  if(r.status===401){TOKEN="";localStorage.removeItem("ragportal_token");}
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||("HTTP "+r.status));
  return d;
}
function esc(s){const map={"&":38,"<":60,">":62,'"':34};
  return String(s==null?"":s).replace(/[&<>"]/g,c=>"&#"+map[c]+";");}
function faDate(ts){try{return new Date(ts*1000).toLocaleDateString("fa-IR");}catch(e){return "";}}

/* ---------------- T4: inline citations (answer_spans + citations) ---------------- */
function renderAnswerText(a){
  const spans=(a.answer_spans||[]);
  const text=String(a.text||"");
  if(!spans.length)return `<p>${esc(text)}</p>`;
  const paras=text.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
  if(!paras.length)return `<p>${esc(text)}</p>`;
  return paras.map((p,i)=>{
    const s=spans[i];
    const chip=s?` <span class="srcchip"><span class="em">📖</span>${esc(s.book_name||"منبع")}${s.page_number!=null&&s.page_number!==""?` — صفحهٔ ${esc(s.page_number)}`:""}`:"";
    return `<p>${esc(p)}${chip}</p>`;
  }).join("");
}
function citationsBlock(a){
  const c=(a.citations||[]);
  if(!c.length)return "";
  return `<details class="cites"><summary>منابع این پاسخ (${c.length}) — روی «باز کردن» برای دیدن صفحهٔ اصلی بزنید</summary>
    <ol>${c.map(x=>`<li><b>${esc(x.book_name||"")}</b>${x.page_number!=null&&x.page_number!==""?` — صفحهٔ ${esc(x.page_number)}`:""}
      ${x.link?` · <a href="${esc(x.link)}" target="_blank" rel="noopener">باز کردن منبع ↗</a>`:""}
      ${x.excerpt?`<div class="ex">${esc(x.excerpt)}</div>`:""}</li>`).join("")}</ol>
  </details>`;
}

/* V4M-P2: contextual CTA microinteractions — busy state + success pulse (no re-render) */
function busyOn(btn){if(!btn||btn.__busy)return;btn.__busy=true;btn.__orig=btn.innerHTML;btn.disabled=true;btn.classList.add("busy");}
function busyOff(btn){if(!btn||!btn.__busy)return;btn.__busy=false;btn.disabled=false;btn.classList.remove("busy");btn.innerHTML=btn.__orig;}
function donePulse(btn,label,ms){if(!btn)return;btn.classList.remove("cta-done");void btn.offsetWidth;btn.classList.add("cta-done");if(label){const o=btn.innerHTML;btn.innerHTML=label;setTimeout(()=>{if(document.contains(btn))btn.innerHTML=o;},ms||900);}}
async function submitAsk(){
  const q=$("#q").value.trim();
  if(q.length<4){toast("سؤال کوتاه است");return;}
  NEXT_PHASE=null;
  $("#floatNext")?.remove();
  const b=$("#btnAsk");busyOn(b);
  $("#askArea").innerHTML='<div class="progress"><span class="spin"></span>ثبت سؤال…</div>';
  try{
    const d=await api("/ask",{method:"POST",body:JSON.stringify({question:q,corpora:[]})});
    SESSION=d;
    $("#askArea").innerHTML='';
    busyOff(b);donePulse(b,"ثبت شد ✅",1100);
    const cs=await api("/corpora");
    $("#askArea").innerHTML=`
      <div style="margin-top:14px">تمام منابع علمی از همین حالا در اختیار شماست — منبع پاسخ را انتخاب کنید:</div>
      <div class="chips" id="chips"><span class="chip" data-id="__all" id="chipAll" style="border-color:var(--acc);font-weight:600">✅ انتخاب همه</span>${cs.map(c=>`<span class="chip" data-id="${esc(c.id)}"><span class="em">📚</span>${esc(c.name_fa)}</span>`).join("")}<span class="chip" data-id="__none" id="chipNone" style="opacity:.7">❌ لغو انتخاب</span><button class="primary" id="btnPick" style="margin-inline-start:auto;align-self:center">تولید پاسخ</button></div>`;
    const realChips=[...document.querySelectorAll("#chips .chip")].filter(c=>c.dataset.id!=="__all"&&c.dataset.id!=="__none");
    document.querySelectorAll("#chips .chip").forEach(ch=>{
      if(ch.dataset.id==="__all"){
        ch.onclick=()=>{realChips.forEach(c=>c.classList.add("on"));};
      }else if(ch.dataset.id==="__none"){
        ch.onclick=()=>{realChips.forEach(c=>c.classList.remove("on"));};
      }else{
        ch.onclick=()=>ch.classList.toggle("on");
      }
    });
    $("#btnPick").onclick=async()=>{
      const ids=[...document.querySelectorAll("#chips .chip.on")].map(c=>c.dataset.id).filter(id=>id!=="__all"&&id!=="__none");
      if(!ids.length){toast("حداقل یک مجموعه انتخاب کنید");return;}
      const b2=$("#btnPick");busyOn(b2);
      try{
        const d2=await api(`/sessions/${SESSION.session_id}/pick`,{method:"POST",body:JSON.stringify({corpora:ids})});
        pollSession(d2.session_id);
      }catch(e2){busyOff(b2);toast(e2.message);}
    };

}

function _answerStatus(a){
  const text=String(a.text||"");
  const cits=(a.citations||[]).length;
  const isError=text.includes("خطا در تولید پاسخ")||text.includes("در هنگام تولید پاسخ خطایی");
  const isNotFound=text.includes("پیدا نکردم")||text.includes("پیدا نشد")||text.includes("پیدا نکرد");
  if(isError)return {cls:"err",icon:"⚠️",label:"خطای فنی در جست‌وجو"};
  if(isNotFound)return {cls:"nf",icon:"📭",label:"پاسخ قابل استنادی پیدا نشد"};
  if(!cits&&text.length>20)return {cls:"nocit",icon:"⚠️",label:"پاسخ بدون استناد"};
  return {cls:"ok",icon:"✅",label:`${cits} منبع استنادشده`};
}

/* V4M-P3: floating next-page CTA + one-time explainer */
function updateFloatNext(s){
  const more=(VIEW==="ask"&&s&&canNextPage(s));
  const f=$("#floatNext");
  if(!more){if(f)f.remove();return;}
  if(!f){
    const b=document.createElement("button");
    b.id="floatNext";b.className="primary";b.textContent="صفحهٔ بعد نتایج ↓";
    b.onclick=()=>askNextPage(SID_CUR);
    document.body.appendChild(b);
  }
  nextPageExplain();
}
function nextPageExplain(){
  const key="ragportal_np_seen_"+(ME?ME.id:"guest");
  try{if(localStorage.getItem(key))return;}catch(e){return;}
  if(document.querySelector('[data-modal="np"]'))return;
  const html=`<div data-modal="np" class="modal-back" onclick="if(event.target===this)this.remove()">
    <div class="card modal-card" style="width:min(440px,100%)">
      <div class="row" style="justify-content:space-between"><b>📄 صفحهٔ بعدی نتایج</b>
        <button class="ghost small" onclick="this.closest('[data-modal]').remove()">×</button></div>
      <div class="muted" style="margin-top:10px;line-height:2">در این مرحله، سامانه منابع و نتایج تکمیلی را بررسی می‌کند… اگر می‌خواهید عمیق‌تر شوید، با «صفحهٔ بعد نتایج» همان سؤال را از پنجرهٔ بعدی همین جست‌وجو بگیرید (پیش‌تولید می‌شود).</div>
      <div class="row" style="margin-top:14px;justify-content:flex-end;gap:8px">
        <button class="ghost small" id="npNoMore">دیگر نمایش نده</button>
        <button class="primary small" id="npOk">متوجه شدم</button>
      </div></div></div>`;
  document.body.insertAdjacentHTML("beforeend",html);
  const done=()=>{try{localStorage.setItem(key,"1");}catch(e){}document.querySelector('[data-modal="np"]')?.remove();};
  $("#npOk").onclick=done;
  $("#npNoMore").onclick=done;
}
function streamSession(sid){
  if(STREAM_TRIED||STREAM_LIVE)return;
  STREAM_TRIED=true;
  try{
    const es=new EventSource("/api/sessions/"+sid+"/stream");
    STREAM_ES=es;
    const buf={};
    es.onmessage=(ev)=>{
      let d={};try{d=JSON.parse(ev.data);}catch(e){return;}
      if(d.type==="progress"||d.type==="session_start"){STREAM_LIVE=true;
        $("#askArea").innerHTML='<div class="progress row"><span class="ldot"></span><span class="spin"></span>'+esc(d.progress||"")+'</div><div id="liveStream" style="margin-top:10px"></div>';}
      else if(d.type==="corpus_start"){STREAM_LIVE=true;buf[d.corpus]="";const box=$("#liveStream");if(box)box.innerHTML+=liveStreamCard(d.corpus,"");}
      else if(d.type==="corpus_token"){STREAM_LIVE=true;buf[d.corpus]=(buf[d.corpus]||"")+(d.text||"");const box=$("#liveStream");if(box)box.innerHTML=Object.keys(buf).map(c=>liveStreamCard(c,buf[c])).join("");const ls=box.querySelector("div[style*=overflow-y]");if(ls)ls.scrollTop=ls.scrollHeight;}
      else if(d.type==="poll"){if(STREAM_ES){STREAM_ES.close();STREAM_ES=null;}STREAM_LIVE=false;renderSession(d);if(d.status==="done"||d.status==="error")clearInterval(POLL);}
      else if(d.type==="session_end"){/* final poll snapshot follows */}
    };
    es.onerror=()=>{if(STREAM_ES){STREAM_ES.close();STREAM_ES=null;}STREAM_LIVE=false;};
  }catch(e){STREAM_TRIED=false;}
}
function pollSession(sid){
  clearInterval(POLL);
  SID_CUR=sid;
  STREAM_TRIED=false;STREAM_LIVE=false;
  if(STREAM_ES){try{STREAM_ES.close();}catch(e){}STREAM_ES=null;}
  $("#askArea").innerHTML='<div class="progress"><span class="ldot"></span><span class="spin"></span>در حال تولید پاسخ…</div>';
  streamSession(sid);
  POLL=setInterval(async()=>{
    if(STREAM_LIVE)return;
    try{
      const s=await api(`/sessions/${sid}`);
      renderSession(s);
      if(s.status==="done"||s.status==="error")clearInterval(POLL);
    }catch(e){}
  },2500);
}

function canNextPage(s){
  if(!s||s.status!=="done"||!s.answers||!s.answers.length)return false;
  const latest={};
  s.answers.forEach(a=>{latest[a.corpus_id]=a;});
  const rows=Object.values(latest);
  const page=rows.reduce((m,a)=>Math.max(m,a.round||1),1);
  return page<3 && rows.some(a=>a.has_more);
}
async function askNextPage(sid){
  const bs=[...document.querySelectorAll("#btnNext,#floatNext")];
  bs.forEach(x=>{x.disabled=true;x.classList.add("busy");});
  const b=$("#btnNext");
  if(b)b.textContent="در حال گرفتن صفحهٔ بعد…";
  try{
    const r=await api(`/sessions/${sid}/next`,{method:"POST",body:"{}"});
    NEXT_PHASE=(r&&r.phase)||null;
    pollSession(sid);
  }catch(e){toast(e.message);NEXT_PHASE=null;bs.forEach(x=>{x.disabled=false;x.classList.remove("busy");});if(b)b.textContent="صفحهٔ بعد نتایج";}
}
function ansCard(a){
  const c=CORPORA.find(x=>x.id===a.corpus_id);
  const page=a.result_page||a.round;
  const cached=(a.round||1)>1&&NEXT_PHASE==="done_from_cache";
  const st=_answerStatus(a);
  return `<div class="ans">
    <div class="head"><span class="badge">${esc(c?c.name_fa:a.corpus_id)}</span>
      <span class="badge" style="${st.cls==="err"?"background:var(--danger);color:#fff":st.cls==="nf"?"background:var(--warning);color:#000":""}">${st.icon} ${st.label}</span>
      <span class="badge">صفحهٔ ${page}</span>
      ${a.has_more?'<span class="tag">صفحهٔ بعد هم هست</span>':""}
      ${cached?'<span class="tag">⚡ از کش</span>':""}
      ${a.latency_ms?`<span class="tag">${Math.round(a.latency_ms/1000)} ثانیه</span>`:""}</div>
    ${renderAnswerText(a)}
    ${citationsBlock(a)}
  </div>`;
}

let QA={cursor:null,hasMore:true,loading:false,obs:null,shown:0,total:0};
function viewQa(){

function qaCard(q){
  const c=CORPORA.find(x=>x.id===q.corpus_id);
  const body=String(q.answer||"");
  const short=body.length>420?body.slice(0,420).trim()+" […]":body;
  const aid=q.answer_id;
  const stars=[1,2,3,4,5].map(n=>`<button class="qa-star s${n}" data-qstar="${aid}" data-n="${n}" title="${n} ستاره">★</button>`).join("");
  const nudgePrompt=`دلیلش رو دوست داشتی یه‌جمله بنویس… (اختیاری — برای امتیاز بیشتر)`;
  return `<div class="ans qa-card" data-qa="${aid}" style="margin-top:12px">
    <div class="head"><span class="badge">${esc(c?c.name_fa:q.corpus_id)}</span>
      <span class="muted">${faDate(q.created_at)}</span>
      <span class="muted" id="qacnt${aid}" style="margin-inline-start:auto"></span></div>
    <b style="font-size:14.5px">${esc(q.topic)}</b>
    <p class="qa-short" style="margin-top:8px;color:var(--tx2)">${esc(short)}</p>
    ${body.length>420?`<p class="qa-full" style="margin-top:8px;color:var(--tx2);display:none">${esc(body)}</p>
    <button class="ghost small qa-toggle">نمایش کامل</button>`:""}
    <div class="qa-actions">
      <span class="stars" style="gap:0">${stars}</span>
      <span style="flex:1"></span>
      <button class="ghost small qa-like" data-qaact="like" data-qaid="${aid}">👍 لایک</button>
      <button class="ghost small qa-dislike" data-qaact="dislike" data-qaid="${aid}">👎 دیس‌لایک</button>
    </div>
    <div class="qa-nudge" id="qan${aid}">
      <div>${nudgePrompt}</div>
      <textarea id="qatx${aid}" rows="2" placeholder="علت موافقت یا مخالفتت را بنویس…"></textarea>
      <div class="nrow"><button class="primary small" data-qasub="${aid}">ثبت نظر</button>
        <button class="ghost small" data-qacancel="${aid}">لغو</button></div>
    </div>
  </div>`;
}
function qaBindCard(card){
  const aid=card.dataset.qa;
  const stars=[...card.querySelectorAll(".qa-star")];
  stars.forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n;
    PENDING[aid]=(PENDING[aid]===n)?0:n;
    const cur=PENDING[aid]||0;
    stars.forEach(x=>x.classList.toggle("on",+x.dataset.n<=cur));
  });
  const toggle=card.querySelector(".qa-toggle");
  if(toggle)toggle.onclick=()=>{
    const full=card.querySelector(".qa-full"), sh=card.querySelector(".qa-short");
    const open=full.style.display==="none";
    full.style.display=open?"":"none"; sh.style.display=open?"none":"";
    toggle.textContent=open?"جمع کردن":"نمایش کامل";
  };
  card.querySelectorAll("[data-qaact]").forEach(b=>b.onclick=()=>{
    const verdict=b.dataset.qaact;
    const getStars=()=>PENDING[aid]||3;
    const cm=card.querySelector("textarea");
    rateAnswer(aid,verdict,getStars(),cm?cm.value.trim():null);
  });
  card.querySelector("[data-qasub]").onclick=()=>{
    const cm=card.querySelector("textarea");
    const getStars=()=>PENDING[aid]||3;
    const reason=cm?cm.value.trim():null;
    if(!reason){toast("برای ثبت نظر با علت، اول دلیلت را بنویس.");return;}
    const cur=PENDING[aid]||3;
    rateAnswer(aid,cur>=3?"like":"dislike",cur,reason);
  };
  card.querySelector("[data-qacancel]").onclick=()=>{
    const n=card.querySelector(".qa-nudge"); n.classList.remove("on");
    const cm=card.querySelector("textarea"); if(cm)cm.value="";
  };
}
function qaShowMore(card){
  const n=card.querySelector(".qa-nudge"); if(!n)return;
  const cm=card.querySelector("textarea"); if(cm)cm.value="";
  n.classList.add("on");
  try{cm&&cm.focus();}catch(e){}
}
function qaApply(d,opts){
  const list=$("#qaList");
  (d.items||[]).forEach((q,i)=>{
    const wrap=document.createElement("div");
    wrap.innerHTML=qaCard(q);
    const card=wrap.firstElementChild;
    if(opts&&opts.fresh)card.classList.add("fresh");
    COUNTERS[q.answer_id]={likes:0,dislikes:0,avg:0};
    list.appendChild(card);
    qaBindCard(card);
    QA.shown++;
  });
  QA.cursor=d.next_cursor; QA.hasMore=!!d.has_more; QA.total=d.total||0;
  const sentinel=$("#qaSentinel"), loader=$("#qaLoader");
  if(sentinel)sentinel.style.display=QA.hasMore?"":"none";
  if(loader)loader.style.display="none";
}
function loadQa(){
  QA={cursor:null,hasMore:true,loading:false,obs:null,shown:0,total:0};
  const list=$("#qaList"); if(!list)return;
  list.innerHTML='<div class="card"><span class="spin"></span>در حال بارگذاری…</div>';
  const sentinel=$("#qaSentinel");
  if(QA.obs){try{QA.obs.disconnect();}catch(e){} QA.obs=null;}
  if(sentinel)sentinel.style.display="none";
  api("/qa-bank/v2?limit=20").then(d=>{
    list.innerHTML="";
    if(!(d.items||[]).length){
      list.innerHTML='<div class="card muted">هنوز موردی در بانک نیست. اولین موارد در اولین پیک کاری (۱۴:00 تا ۰۸:00 تهران) ساخته می‌شوند.</div>';
      return;
    }
    qaApply(d,{fresh:false});
    setupQaObserver();
  }).catch(e=>{list.innerHTML=`<div class="card">${esc(e.message)}</div>`;});
}
function setupQaObserver(){
  const sentinel=$("#qaSentinel");
  if(!sentinel)return;
  if(QA.obs){try{QA.obs.disconnect();}catch(e){} QA.obs=null;}
  if(QA.scrollBound){try{window.removeEventListener("scroll",QA.scrollBound);}catch(e){} QA.scrollBound=null;}
  if(typeof IntersectionObserver!=="undefined"){
    QA.obs=new IntersectionObserver(entries=>{
      entries.forEach(en=>{ if(en.isIntersecting) qaLoadNext(); });
    },{rootMargin:"300px 0px"});
    QA.obs.observe(sentinel);
  }
  /* scroll fallback (robust even where the observer is flaky) */
  QA.scrollBound=()=>{
    const r=sentinel.getBoundingClientRect();
    if(r.top<window.innerHeight+300) qaLoadNext();
  };
  window.addEventListener("scroll",QA.scrollBound,{passive:true});
  window.addEventListener("resize",QA.scrollBound,{passive:true});
  /* guaranteed manual fallback: a "load more" button (accessible, works everywhere) */
  const moreWrap=$("#qaMoreWrap"), moreBtn=$("#qaMoreBtn");
  if(moreBtn && !QA.moreBound){
    QA.moreBound=true;
    moreBtn.onclick=()=>{ qaLoadNext(); if(moreBtn.scrollIntoView)moreBtn.scrollIntoView({block:"center"}); };
  }
  qaSyncMoreBtn();
}
function qaSyncMoreBtn(){
  const moreWrap=$("#qaMoreWrap");
  if(moreWrap)moreWrap.style.display=QA.hasMore?"":"none";
}
function qaLoadNext(){
  if(!QA.hasMore||QA.loading)return;
  QA.loading=true;
  const loader=$("#qaLoader"); if(loader){loader.style.display=""; loader.innerHTML='<span class="spin"></span>در حال بارگذاری موارد بیشتر…';}
  const moreBtn=$("#qaMoreBtn"); if(moreBtn){moreBtn.disabled=true;moreBtn.textContent="در حال بارگذاری…";}
  const url=QA.cursor?"/qa-bank/v2?limit=20&cursor="+encodeURIComponent(QA.cursor):"/qa-bank/v2?limit=20";
  api(url).then(d=>{
    qaApply(d,{fresh:true});
    setupQaObserver();   /* re-observe + resync "load more" button */
  }).catch(e=>{
    if(loader)loader.innerHTML=`<div class="muted">${esc(e.message)}</div>`;
    if(moreBtn){moreBtn.disabled=false;moreBtn.textContent="بارگذاری موارد بیشتر";}
  }).finally(()=>{QA.loading=false;});
}

function qaPaintCnt(aid,pop){

async function rateAnswer(aid,verdict,stars,reason){
  if(window.__ratingInflight&&window.__ratingInflight[aid])return;  /* V4M-P1: dedupe — one vote request per answer */
  window.__ratingInflight=window.__ratingInflight||{};
  window.__ratingInflight[aid]=true;
  /* P3: QA-bank cards use a different DOM (data-qa + data-qaid) — handle in place. */
  const qcard=document.querySelector('.ans[data-qa="'+aid+'"]');
  if(qcard){
    const qLike=qcard.querySelector('[data-qact="like"]');
    const qDis=qcard.querySelector('[data-qact="dislike"]');
    const qSub=qcard.querySelector('[data-qasub]');
    [qLike,qDis,qSub].forEach(b=>{if(b){b.disabled=true;b.classList.add("busy");}});
    const snap=JSON.parse(JSON.stringify(COUNTERS[aid]||{likes:0,dislikes:0,avg:0}));
    try{
      const mr=MY_RATING[aid]||null;
      const c=Object.assign({},snap);
      if(!(mr&&mr.verdict===verdict)){
        if(mr)c[mr.verdict==="like"?"likes":"dislikes"]--;
        c[verdict==="like"?"likes":"dislikes"]++;
      }
      COUNTERS[aid]=c;qaPaintCnt(aid,false);
      const d=await api(`/answers/${aid}/rate`,{method:"POST",body:JSON.stringify({stars,verdict,reason})});
      COUNTERS[aid]={likes:d.likes||0,dislikes:d.dislikes||0,avg:d.avg_stars||0};
      MY_RATING[aid]=d.my_rating||null;
      qaPaintCnt(aid,true);
      const m2=d.my_rating||null;
      if(qLike)qLike.classList.toggle("on",!!m2&&m2.verdict==="like");
      if(qDis)qDis.classList.toggle("on",!!m2&&m2.verdict==="dislike");
      if(reason){const nx=qcard.querySelector(".qa-nudge");if(nx)nx.classList.remove("on");}
      await refreshMe();
      toast(d.changed?("نظر ثبت شد ✅ (+"+d.points_earned+" امتیاز)"):"نظر شما ثبت شده — چون تغییری ندادید، امتیازی اضافه نشد.");
    }catch(e){
      COUNTERS[aid]=snap;qaPaintCnt(aid,false);
      toast(e.message);
    }finally{
      delete window.__ratingInflight[aid];
      [qLike,qDis,qSub].forEach(b=>{if(b){b.disabled=false;b.classList.remove("busy");}});
    }
    return;
  }
  const card=document.querySelector('.ans[data-a="'+aid+'"]');
  const likeB=document.getElementById("vb"+aid+"_like");
  const disB=document.getElementById("vb"+aid+"_dis");
  const subB=card?card.querySelector('[data-r]'):null;
  const snap=JSON.parse(JSON.stringify(COUNTERS[aid]||{likes:0,dislikes:0,avg:0}));
  if(likeB){likeB.disabled=true;likeB.classList.add("busy");}
  if(disB){disB.disabled=true;disB.classList.add("busy");}
  if(subB)subB.disabled=true;
  /* optimistic in-place update (reconciled by the server response below) */
  try{
    const mr=MY_RATING[aid]||null;
    const c=Object.assign({},snap);
    if(!(mr&&mr.verdict===verdict)){
      if(mr)c[mr.verdict==="like"?"likes":"dislikes"]--;
      c[verdict==="like"?"likes":"dislikes"]++;
    }
    COUNTERS[aid]=c;paintCnt(aid,false);
    const d=await api(`/answers/${aid}/rate`,{method:"POST",body:JSON.stringify({stars,verdict,reason})});
    /* authoritative in-place update — NO full re-render: scroll, <details>,
       input values and page state are preserved */
    COUNTERS[aid]={likes:d.likes||0,dislikes:d.dislikes||0,avg:d.avg_stars||0};
    MY_RATING[aid]=d.my_rating||null;
    paintCnt(aid,true);
    const m2=d.my_rating||null;
    if(likeB)likeB.classList.toggle("on",!!m2&&m2.verdict==="like");
    if(disB)disB.classList.toggle("on",!!m2&&m2.verdict==="dislike");
    await refreshMe();
    toast(d.changed?("نظر ثبت شد ✅ (+"+d.points_earned+" امتیاز)"):"نظر شما ثبت شده — چون تغییری ندادید، امتیازی اضافه نشد.");
  }catch(e){
    COUNTERS[aid]=snap;paintCnt(aid,false);   /* rollback on failure */
    toast(e.message);
  }finally{
    delete window.__ratingInflight[aid];
    if(likeB){likeB.disabled=false;likeB.classList.remove("busy");}
    if(disB){disB.disabled=false;disB.classList.remove("busy");}
    if(subB)subB.disabled=false;
  }
}

function faTs(ts){try{return new Date(ts*1000).toLocaleString("fa-IR",{dateStyle:"medium",timeStyle:"short"});}catch(e){return "";}}
function localIso(ts){if(!ts)return "";const d=new Date(ts*1000);if(isNaN(d))return "";
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
function toUtcIso(v){if(!v)return null;const d=new Date(v);if(isNaN(d))return null;return d.toISOString().replace(/\.\d{3}Z$/,"Z");}
function campRow(c){

/* PHASE5: shareable deep-link (#ttsl=<slug>) — independent of async init so it
   reliably opens the think-tank question page even if init's await chain stalls. */
(function(){
  var _sl=(location.hash.match(/#ttsl=([A-Za-z0-9_-]+)/)||[])[1];
  if(!_sl) return;
  function _open(){
    try{
      setView("thinktank");
      // openThinkTank is defined later; call once available
      var _tries=0;
      var _t=setInterval(function(){
        _tries++;
        if(typeof openThinkTank==="function"){
          clearInterval(_t);
          fetch("/api/think-tank/slug/"+_sl,{headers:{Authorization:"Bearer "+(localStorage.getItem("ragportal_token")||"")}})
            .then(function(r){return r.ok?r.json():null;})
            .then(function(j){ if(j&&j.id){ openThinkTank(j.id); } })
            .catch(function(){});
        } else if(_tries>20){ clearInterval(_t); }
      },100);
    }catch(e){}
  }
  if(document.readyState==="complete"){ _open(); }
  else { window.addEventListener("load",_open); }
})();

/* 5d.2: connection state is read from the BACKEND (/api/bale/link-status), never
   from localStorage. Each card is independent (Bale + Telegram). Minting a code is
   single-use; a second click while loading is ignored. The code is shown ONLY after a
   successful API response.
   5d.3 fix: the minted code now lives in window.MSG_STATE[plat].code (not just the DOM),
   and status refreshes PATCH the badge + code area in place instead of innerHTML-replacing
   the whole card. That was the root cause of the code vanishing (a status refresh after
   mint wiped the freshly-rendered code). The code now persists across re-renders, tab
   switches and refreshes until it is consumed/expired or a new code is minted.
   The code is held in in-memory state only — it is never written to localStorage or logs. */
const MSG_BOT={
  telegram:{username:"ismc_rag_bot",linkBase:"https://t.me/ismc_rag_bot"},
  bale:{username:"ismc_rag_bot",linkBase:"https://ble.ir/ismc_rag_bot"}
};
const MSG_META={
  bale:{ic:"🤖",name:"پیامرسان بله",hint:"کد را به ربات بله بفرستید: /start <کد>"},
  telegram:{ic:"✈️",name:"تلگرام",hint:"کد را به ربات تلگرام بفرستید: /start <کد>"}
};
window.MSG_STATE={bale:null,telegram:null};
let _msgBusy={bale:false,telegram:false};
function _msgCodeOf(plat){const s=window.MSG_STATE[plat];return (s&&s.code)||"";}
function _msgExpired(plat){const s=window.MSG_STATE[plat];return !!(s&&s.expiresAt&&Date.now()>=s.expiresAt);}
// Official deep link: <linkBase>?start=<code>. Both platforms use the standard
// /start deep-link parameter (Telegram Bot API; Bale "پیوندهای بازو" / ble.ir).
function _msgDeepLink(plat){
  const b=MSG_BOT[plat];
  const c=_msgCodeOf(plat);
  if(!b)return "";
  return c?b.linkBase+"?start="+encodeURIComponent(c):b.linkBase;
}
// Client-side expiry countdown (display-only; real expiry is enforced server-side).
function _msgCountdown(plat){
  const s=window.MSG_STATE[plat];
  if(!s||!s.expiresAt)return "";
  let r=Math.max(0,Math.floor((s.expiresAt-Date.now())/1000));
  const m=Math.floor(r/60);r=r%60;
  return `${m}:${String(r).padStart(2,"0")}`;
}

function msgCodeBlockHtml(plat){
  const st=window.MSG_STATE[plat];

  if(st&&st.err)

  if(_msgExpired(plat))

      <div class="row" style="margin-top:6px;gap:8px"><button class="primary small" id="msgBtn_${plat}">🔁 دریافت کد جدید</button></div>`;

function _renderMsgPlat(plat){

function _showMsgError(plat,msg){

function wireMsgPlat(plat){
  const mint=plat=>{
    if(_msgBusy[plat])return;          // no over-minting on multi-click
    _msgBusy[plat]=true;
    const s=window.MSG_STATE[plat]||{};
    s.err=null;s.busy=true;window.MSG_STATE[plat]=s;
    const body=$("#msgBody_"+plat);
    if(body)body.innerHTML=`<div class="muted" style="font-size:12px;margin-top:2px"><span class="spin"></span>در حال دریافت کد…</div>`;
    api("/bale/connect-code?platform="+plat,{method:"POST"}).then(d=>{
      const code=d&&d.code;
      if(!code)throw new Error("کدی دریافت نشد");
      const st=window.MSG_STATE[plat]||{};
      st.code=code;st.err=null;st.busy=false;
      st.expiresAt=Date.now()+((d.expires_in||600)*1000);
      st.pending=true;st.connected=false;
      window.MSG_STATE[plat]=st;
      const b2=$("#msgBody_"+plat);
      if(b2)b2.innerHTML=msgBodyHtml(plat);   // in-place: code stays, no full-card wipe
      wireMsgPlat(plat);
      _startMsgCountdown(plat);
      toast("کد اتصال دریافت شد ✅");
    }).catch(e=>{
      const s2=window.MSG_STATE[plat]||{};
      s2.err=_msgErrText(e);s2.busy=false;window.MSG_STATE[plat]=s2;
      const b3=$("#msgBody_"+plat);
      if(b3)b3.innerHTML=msgBodyHtml(plat);
      wireMsgPlat(plat);
    });
  };
  const b=$("#msgBtn_"+plat);   if(b)b.onclick=()=>mint(plat);
  const nb=$("#msgNewBtn_"+plat); if(nb)nb.onclick=()=>mint(plat);
  const cp=$("#msgCopy_"+plat);
  if(cp)cp.onclick=async()=>{
    const c=_msgCodeOf(plat); if(!c)return;
    try{await navigator.clipboard.writeText(c);toast("کد کپی شد ✅");}
    catch(e){ /* fallback */ const ta=document.createElement("textarea");ta.value=c;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("کد کپی شد ✅");}catch(_){toast("کپی نشد؛ کد را دستی انتخاب کنید.");}finally{ta.remove();} }
  };
}
function _startMsgCountdown(plat){
  const el=$("#msgExp_"+plat);
  if(!el)return;
  clearInterval(el._cd);
  el._cd=setInterval(()=>{
    const s=window.MSG_STATE[plat];
    if(!s||!s.code){clearInterval(el._cd);return;}
    if(Date.now()>=s.expiresAt){clearInterval(el._cd);el.textContent="منقضی";_showMsgError(plat,"کد منقضی شده است؛ کد جدید بگیرید.");return;}
    el.textContent=_msgCountdown(plat);
  },1000);
}
function _msgErrText(e){
  const msg=(e&&e.message)||"";
  if(/401|auth/i.test(msg))return "نشست شما منقضی شده؛ دوباره وارد شوید.";
  if(/403|forbidden/i.test(msg))return "دسترسی شما برای این عملیات محدود است.";
  if(/503|unavailable|not available/i.test(msg))return "اتصال ربات فعلا‌ً در دسترس نیست. کمی بعد دوباره تلاش کنید.";
  if(/fetch|network|failed to fetch|timeout/i.test(msg))return "خطای شبکه؛ اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.";
  return msg||"خطای ناشناخته در دریافت کد اتصال.";
}
async function refreshMsgStatus(plat){
  if(!ME)return;
  try{
    const d=await api("/bale/link-status");
    const plats=d.platforms||{};
    const merge=(p)=>{
      const old=window.MSG_STATE[p]||{code:null,expiresAt:null,err:null};
      const fresh=plats[p]||{connected:false,pending:false,bot_enabled:false};
      const next={...old,...fresh};
      // Keep the client-side code only if still active and not yet consumed;
      // if the server says connected, drop the code (it was used).
      if(fresh.connected){next.code=null;next.expiresAt=null;clearInterval($("#msgExp_"+p)&&$("#msgExp_"+p)._cd);}
      else if(next.code){ next.pending=true; }  // still holding an unconsumed code
      window.MSG_STATE[p]=next;
    };
    if(plat){merge(plat);}
    else{merge("bale");merge("telegram");}
    // PATCH in place (badge + body) so an active code is never wiped by a status refresh.
    if(plat){_patchMsgPlat(plat);}
    else{_patchMsgPlat("bale");_patchMsgPlat("telegram");}
  }catch(e){ /* keep current; do not fake a status */ }
}
function _patchMsgPlat(plat){
  const st=window.MSG_STATE[plat];
  if(!st)return;
  const badge=$("#msgBadge_"+plat);
  if(!badge){
    // Box is still in the loading placeholder (no badge/body yet) — rebuild it from state.
    _renderMsgPlat(plat);
    return;
  }
  const done=!!st.connected,pend=!!st.pending&&!done;
  badge.innerHTML=done?`<span class="badge ok">✅ متصل شد</span>`
    :(pend?`<span class="badge" style="background:var(--info);color:var(--infotx)">در انتظار اتصال</span>`
    :`<span class="badge" style="background:var(--chipbg);color:var(--chiptx)">متصل نشده</span>`);
  const body=$("#msgBody_"+plat);
  if(body){body.innerHTML=msgBodyHtml(plat);wireMsgPlat(plat);
    if(_msgCodeOf(plat))_startMsgCountdown(plat);}
}

    const tc=$("#ttTagCloud");
    tc.innerHTML=(d.tag_cloud||[]).map(t=>
      `<button class="ghost small ${TT_TAG===t.tag?"on":""}" data-ttcl="${esc(t.tag)}">${esc(t.tag)} <small>${t.n}</small></button>`
    ).join(" ")+'<button class="ghost small" data-ttcl="">همه</button>';
    // list
    const list=d.questions||[];
    $("#ttList").innerHTML=list.length?list.map(ttCardHTML).join("")
      :'<div class="muted">هنوز پرسشی در اتاق فکر ثبت نشده است. از تب «پرسش» یک سؤال بپرسید و آن را به اتاق فکر اضافه کنید.</div>';
    bindTT();
    // deep-link: #ttsl=<slug> opens that question directly (shareable URL)
    const m=(window.__TT_SLUG||location.hash.match(/#ttsl=([A-Za-z0-9_-]+)/)||[null,window.__TT_SLUG]);
    if(m&&(m[1]||window.__TT_SLUG)){
      m[1]=m[1]||window.__TT_SLUG;
      try{
        const r=await api("/think-tank/slug/"+m[1]);
        openThinkTank(r.id);
      }catch(e){/* fall back to list */}
    }
  }catch(e){
    $("#ttList").innerHTML=`<div class="card">${esc(e.message)}</div>`;
  }
}
async function openThinkTank(qid){
  TT_CUR=qid;
  const home=$("#ttHome"),det=$("#ttDetail");
  home.style.display="none";det.style.display="";
  det.innerHTML='<span class="spin"></span>در حال بارگذاری…';
  try{
    const q=await api("/think-tank/"+qid);
    TT_DETAIL=q;
    renderTTDetail(q);
    try{history.replaceState(null,"","#ttsl="+q.slug);}catch(e){}
    det.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){det.innerHTML=`<div class="card">${esc(e.message)}</div>`;}
}
function ttCitationHTML(c){
  const nm=c.book_name||c.book_id||"منبع";
  const pg=c.page_number?`، صفحهٔ ${c.page_number}`:"";
  const lnk=c.link?`<a href="${esc(c.link)}" target="_blank" rel="noopener">مشاهده</a>`:"";
  return `<div style="border-left:3px solid var(--acc,#3b82f6);padding:4px 10px;margin:4px 0;background:rgba(127,127,127,.06);border-radius:6px">
    <b>${esc(nm)}${pg}</b> ${lnk}
    ${c.excerpt?`<div class="muted" style="font-size:13px;margin-top:2px">${esc(c.excerpt)}</div>`:""}
  </div>`;
}
function renderTTDetail(q){
  try{const _cb=document.createElement("button");_cb.className="ghost small";_cb.style.cssText="margin-bottom:8px";_cb.textContent="کپی لینک پایدار";_cb.onclick=()=>{try{navigator.clipboard.writeText(location.origin+"/#ttsl="+q.slug);toast("لینک کپی شد");}catch(e){toast("کپی ناموفق بود");}};const _dt=document.getElementById("ttDetail");if(_dt){_dt.insertBefore(_cb,_dt.firstChild);}}catch(e){}
  const det=$("#ttDetail");
  const ans=(q.answers||[]);
  const citsTotal=ans.reduce((s,a)=>s+(a.citation_count||0),0);
  det.innerHTML=`
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <button class="ghost small" id="ttBack">← بازگشت به اتاق فکر</button>
      ${ME&&ME.points>=10?`<button class="ghost small" id="ttUpvote">👍 رأی مثبت (${q.upvotes||0})</button>`:""}
    </div>
    <h2 style="font-size:20px;margin:6px 0">${esc(q.title)}</h2>
    <div style="margin:6px 0">${(q.tags||[]).map(t=>`<span class="tag" data-tttag="${esc(t)}">${esc(t)}</span>`).join(" ")}</div>
    <div class="muted" style="font-size:13px">${q.views||0} بازدید · شناسهٔ پایدار: ${esc(q.slug||("q-"+q.id))}
      ${q.created_at?` · ${faDate(q.created_at)}`:""}</div>
    <div class="card" style="margin-top:12px">
      <b>پاسخ‌ها (${ans.length}) · استنادها (${citsTotal})</b>
      ${ans.length?ans.map(a=>`
        <div style="margin-top:12px;border-top:1px solid var(--line,rgba(127,127,127,.2));padding-top:10px">
          <div class="row" style="justify-content:space-between">
            <span class="tag">${esc(a.corpus_name||a.corpus_id||"corpus")}</span>
            <span class="muted" style="font-size:13px">${a.citation_count||0} استناد
              ${a.latency_ms?` · ${(a.latency_ms/1000).toFixed(1)} ثانیه`:""}
              ${a.result_page?` · صفحهٔ ${a.result_page}${a.has_more?" (ادامه دارد)":""}`:""}</span>
          </div>
          <div style="margin-top:6px;line-height:1.9;white-space:pre-wrap">${esc(a.text||"")}</div>
          ${(a.citations&&a.citations.length)?`<div style="margin-top:8px"><b>استنادها:</b>
            ${a.citations.map(ttCitationHTML).join("")}</div>`:`<div class="muted" style="font-size:13px;margin-top:6px">بدون استناد</div>`}
        </div>`).join("")
      :'<div class="muted" style="margin-top:8px">برای این پرسش پاسخی ثبت نشده است (احتمالا RAG در زمان پرسش در دسترس نبوده).</div>'}
    </div>
    <div class="card" style="margin-top:12px">
      <b>دیدگاه‌های عمومی (${(q.comments||[]).length})</b>
      <div id="ttComments" style="margin-top:8px">
        ${(q.comments||[]).length?(q.comments).map(c=>`
          <div style="border-top:1px solid var(--line,rgba(127,127,127,.2));padding:8px 0">
            <span class="tag">${esc(c.alias)}</span> <span class="muted" style="font-size:12px">${c.created_at?faDate(c.created_at):""}</span>
            <div style="margin-top:3px;line-height:1.8">${esc(c.text)}</div>
          </div>`).join("")
        :'<div class="muted">هنوز دیدگاهی ثبت نشده است.</div>'}
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <textarea id="ttComment" placeholder="دیدگاه عمومی خود را بنویسید…" rows="2"
          style="flex:1;padding:8px;border:1px solid var(--line,rgba(127,127,127,.3));border-radius:8px;background:transparent;color:inherit"></textarea>
        <button class="ghost" id="ttCommentSend">ثبت دیدگاه</button>
      </div>
      ${ME&&ME.points<30?`<div class="muted" style="font-size:12px;margin-top:4px">🔒 ثبت دیدگاه عمومی از ۳۰ امتیاز باز می‌شود (شما ${ME.points} دارید).</div>`:""}
    </div>
    <div class="card" style="margin-top:12px">
      <b>🏆 لیدربرد مشارکت</b>
      <div id="ttLeaderboard" style="margin-top:8px"><span class="spin"></span>در حال بارگذاری…</div>
    </div>`;
  // PHASE5: participation leaderboard (top contributors by points, global portal)
  api("/leaderboard?period=1m").then(d=>{
    const rows=(d.rows||[]).slice(0,10);
    const box=$("#ttLeaderboard");
    if(!box)return;
    box.innerHTML=rows.length?rows.map((u,i)=>{
      const rank=["🥇","🥈","🥉"][i]||(i+1);
      return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line,rgba(127,127,127,.15));font-size:14px">
        <span>${rank} ${esc(u.alias||"?")} <span class="muted" style="font-size:12px">${esc(u.level||"")}</span></span>
        <span class="muted">${u.points||0} امتیاز · ${u.questions||0} پرسش</span>
      </div>`;
    }).join(""):'<div class="muted">هنوز مشارکتی ثبت نشده است.</div>';
  }).catch(()=>{const b=$("#ttLeaderboard");if(b)b.innerHTML='<div class="muted">لیدربرد در دسترس نیست.</div>';});
  $("#ttBack").onclick=()=>loadThinkTank();
  const uv=$("#ttUpvote");
  if(uv)uv.onclick=async()=>{busyOn(uv);try{await api(`/think-tank/${q.id}/upvote`,{method:"POST"});openThinkTank(q.id);}catch(e){toast(e.message);}finally{busyOff(uv);}};
  const cs=$("#ttCommentSend");
  if(cs)cs.onclick=async()=>{
    const ta=$("#ttComment");const text=ta.value.trim();
    if(!text)return;
    busyOn(cs);
    try{await api(`/think-tank/${q.id}/comments`,{method:"POST",body:JSON.stringify({text})});ta.value="";openThinkTank(q.id);}
    catch(e){toast(e.message);}finally{busyOff(cs);}
  };
  bindTT();
}
function bindTT(){
  document.querySelectorAll("[data-ttq]").forEach(el=>el.onclick=()=>openThinkTank(+el.dataset.ttq));
  document.querySelectorAll("[data-tttag]").forEach(el=>el.onclick=(ev)=>{ev.stopPropagation();TT_TAG=el.dataset.tttag;setView("thinktank");loadThinkTankTTTag();});
  document.querySelectorAll("[data-ttcl]").forEach(el=>el.onclick=()=>{TT_TAG=el.dataset.ttcl||null;loadThinkTankTTTag();});
}
async function loadThinkTankTTTag(){
  // reload with tag filter by re-calling loadThinkTank then applying tag client-side
  await loadThinkTank();
  // after load, if a tag filter is active, narrow the list
  if(TT_TAG){
    // refetch with tag param
    try{
      const d=await api("/think-tank?tag="+encodeURIComponent(TT_TAG));
      const list=d.questions||[];
      $("#ttList").innerHTML=list.length?list.map(ttCardHTML).join("")
        :'<div class="muted">پرسشی با این برچسب پیدا نشد.</div>';
      bindTT();
    }catch(e){/* keep unfiltered list */}
  }
}
</script>
